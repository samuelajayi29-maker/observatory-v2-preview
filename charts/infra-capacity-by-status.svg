<text x="28" y="336" font-family="IBM Plex Sans,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#66757F">16 of 22 register rows carry no published megawatt figure and are excluded.</text>
<text x="28" y="356" font-family="IBM Plex Sans,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#66757F">0.9% of the capacity named here is serving load.</text>
