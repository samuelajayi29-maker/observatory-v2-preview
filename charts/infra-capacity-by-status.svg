<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" width="820" height="430" role="img" aria-label="Data centre capacity in Africa by delivery status: energised capacity is a small fraction of announced.">
<rect width="820" height="430" fill="#FFFFFF"/>
