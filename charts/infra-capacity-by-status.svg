<text x="534.3" y="226" font-family="IBM Plex Sans,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#0D1B2A">174.0 MW</text>
<text x="236" y="276" text-anchor="end" font-family="IBM Plex Sans,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#0D1B2A">Announced, no consent</text>
